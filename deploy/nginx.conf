# Reverse proxy example: Nuxt, Laravel API and imgproxy on a single domain.
#
#   /          -> web (Nuxt)
#   /api/      -> api (Laravel Octane)
#   /storage/  -> api (public disk files)
#   /image/    -> imgproxy, cached (IMGPROXY_PATH_PREFIX=/image)
#
# apps/api/.env: APP_URL=https://example.com, FRONTEND_URL=https://example.com,
#                IMGPROXY_URL=https://example.com/image
# apps/web/.env: APP_URL=https://example.com, IMGPROXY_URL=https://example.com/image
#
# Place into /etc/nginx/conf.d/ (http context).

proxy_cache_path /var/cache/nginx/imgproxy levels=1:2 keys_zone=imgproxy:10m max_size=1g inactive=30d use_temp_path=off;

upstream web {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream api {
    server 127.0.0.1:8000;
    keepalive 16;
}

upstream imgproxy {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # Must exceed uploads.max_size (apps/api/config/uploads.php)
    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    location /api/ {
        proxy_pass http://api;
    }

    location /storage/ {
        proxy_pass http://api;
    }

    # imgproxy URLs are signed and immutable, so results can be cached for a long time
    location /image/ {
        proxy_pass http://imgproxy;
        proxy_cache imgproxy;
        proxy_cache_valid 200 30d;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location / {
        proxy_pass http://web;
    }
}
