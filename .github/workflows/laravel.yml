permissions:
  contents: read
name: Laravel

on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/laravel.yml'
      - 'apps/api/app/**'
      - 'apps/api/bootstrap/**'
      - 'apps/api/config/**'
      - 'apps/api/database/**'
      - 'apps/api/routes/**'
      - 'apps/api/tests/**'
      - 'apps/api/composer.json'
      - 'apps/api/phpunit.xml'
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/workflows/laravel.yml'
      - 'apps/api/app/**'
      - 'apps/api/bootstrap/**'
      - 'apps/api/config/**'
      - 'apps/api/database/**'
      - 'apps/api/routes/**'
      - 'apps/api/tests/**'
      - 'apps/api/composer.json'
      - 'apps/api/phpunit.xml'

jobs:
  pest:
    name: Pest (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '8.4', '8.5' ]
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      # composer.lock is not committed, so cache downloads rather than vendor
      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('apps/api/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.php }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run Pest
        run: ./vendor/bin/pest --no-coverage
